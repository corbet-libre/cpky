[package]
name = "cpky"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Device Passkeys ceremonies with local opaque PRF handover"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://github.com/corbet-foss/cpky"
publish = false
autotests = false

[[test]]
name = "server"
path = "tests/server.rs"

[[example]]
name = "loopback_page"
crate-type = ["cdylib"]

[lib]
crate-type = ["rlib"]

[features]
default = []
test-authenticator = ["dep:passkey", "dep:passkey-types", "dep:async-trait", "dep:reqwest"]

[dependencies]
base64 = "0.22"
sha2 = "0.10"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"
url = "2"
subtle = "2"
passkey = { version = "0.4", optional = true }
passkey-types = { version = "0.4", features = ["serialize_bytes_as_base64_string"], optional = true }
async-trait = { version = "0.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
getrandom = "0.4"
webbrowser = "1"
reqwest = { version = "0.13", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["Window", "Navigator", "CredentialsContainer", "CredentialCreationOptions", "CredentialRequestOptions", "AbortController", "AbortSignal", "Location", "History", "Request", "RequestInit", "RequestMode", "RequestCredentials", "RequestCache", "RequestRedirect", "ReferrerPolicy", "Response", "Headers"] }
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
futures = "0.3"
static_assertions = "1"
wasm-bindgen-test = "0.3.79"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
ckyh = { git = "https://github.com/corbet-foss/ckyh", branch = "main" }
crlt = { git = "https://github.com/corbet-foss/crlt", branch = "main" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
reqwest = { version = "0.13", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
browser-coverage-runtime = { path = ".github/coverage-runtime" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(owned_browser_coverage)"] }
