[package]
name = "cpky"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Device Passkeys ceremonies with local opaque PRF handover"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://git.corbet.ch/corbet-libre/cpky.git"
publish = false
autotests = false

[[test]]
name = "server"
path = "tests/server.rs"

[[test]]
name = "persistent"
path = "tests/persistent.rs"

[[example]]
name = "loopback_page"
crate-type = ["cdylib"]

[lib]
crate-type = ["rlib"]

[features]
default = []
# Complete a native browser ceremony with a caller-supplied authenticator over the
# real local callback. For trusted native embeddings only; never a default or
# browser build.
embedded-authenticator = ["dep:reqwest", "dep:rustls"]
test-authenticator = ["embedded-authenticator", "dep:passkey", "dep:passkey-types", "dep:async-trait"]
# Deterministic software credential for an operator identity whose seed is held in
# an external secret store. Never part of a default or browser build.
persistent-software = ["dep:passkey", "dep:passkey-types", "dep:async-trait", "dep:hkdf", "dep:p256", "dep:coset", "dep:ciborium"]

[dependencies]
base64 = "0.22"
sha2 = "0.10"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"
url = "2"
subtle = "2"
hpke = { version = "0.14", default-features = false, features = ["alloc", "x25519", "chacha"] }
rand_chacha = "0.10"
rand_core = "0.10"
passkey = { version = "0.4", optional = true }
passkey-types = { version = "0.4", features = ["serialize_bytes_as_base64_string"], optional = true }
async-trait = { version = "0.1", optional = true }
hkdf = { version = "0.12", optional = true }
p256 = { version = "0.13", default-features = false, features = ["ecdsa-core", "ecdsa"], optional = true }
coset = { version = "0.3", optional = true }
ciborium = { version = "0.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
getrandom = "0.4"
webbrowser = "1"
reqwest = { version = "0.13", default-features = false, optional = true }
# reqwest 0.13 offers no ring-backed rustls feature; the callback client selects
# ring itself before it is built (src/native.rs `ensure_tls_provider`).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures-channel = "0.3"
futures-util = "0.3"
gloo-timers = "0.3"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["Window", "Navigator", "CredentialsContainer", "CredentialCreationOptions", "CredentialRequestOptions", "AbortController", "AbortSignal", "Location", "History", "Request", "RequestInit", "RequestMode", "RequestCredentials", "RequestCache", "RequestRedirect", "ReferrerPolicy", "Response", "Headers", "BroadcastChannel", "Event", "MessageEvent", "EventTarget", "Performance", "UserActivation"] }
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
futures = "0.3"
static_assertions = "1"
wasm-bindgen-test = "0.3.79"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
ckyh = { git = "https://git.corbet.ch/corbet-libre/ckyh.git", branch = "main" }
crlt = { git = "https://git.corbet.ch/corbet-libre/crlt.git", branch = "main" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
reqwest = { version = "0.13", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
browser-coverage-runtime = { package = "browser-coverage-runtime-cpky", path = ".github/coverage-runtime" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(owned_browser_coverage)"] }
