schema = 1
project = "cpky"
repository = "https://git.corbet.ch/corbet-foss/cpky.git"

[checks.native]
kind = "commands"
commands = [["bash", "ci/native-check.sh"]]

# Pre-existing checks above preserved verbatim; hosted Linux gates appended below.
[checks.verify]
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["python3", "--version"], ["chromedriver", "--version"], ["chromium", "--version"], ["clang", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"]]
cache_outputs = ["coverage.json", "coverage.lcov", "wasm-coverage.json", "wasm-coverage.lcov"]

[render]
tool_revision = "e38f347d6941aa105ac4b55a0d4b8fec2ef22433"

[jobs.verify]
scheduler = "crow"
checks = ["verify"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]

[push_consumer.cmsg-v01]
consumer = "https://git.corbet.ch/corbet-libs/cmsg.git"
branch = "v01"
consumer_branch = "v01"
job = "v01-push"
self_name = "cpky"
