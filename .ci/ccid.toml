schema = 1
project = "cpky"

[checks.native]
kind = "commands"
commands = [["bash", "ci/native-check.sh"]]

# Pre-existing checks above preserved verbatim; hosted Linux gates appended below.
[checks.verify]
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["python3", "--version"], ["chromedriver", "--version"], ["chromium", "--version"], ["clang", "--version"], ["pkg-config", "--version"], ["openssl", "version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"]]
cache_env = ["PKG_CONFIG_PATH", "NIX_CFLAGS_COMPILE", "NIX_LDFLAGS", "LD_LIBRARY_PATH", "CPKY_WASM_CLANG"]
cache_outputs = ["coverage.json", "coverage.lcov", "wasm-coverage.json", "wasm-coverage.lcov"]

[render]
tool_revision = "78a4e05b4e1cb25aaeba3966951564d74277bcbd"

[jobs.verify]
scheduler = "crow"
checks = ["verify"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]
